services:
  - type: web
    name: kazakh-sign-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run_web.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: HOST
        value: 0.0.0.0
      - key: CORS_ORIGINS
        value: http://langict.pryopj/
